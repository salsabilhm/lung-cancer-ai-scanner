<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="css/styleinscription.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo"><img src="images\LOGO.png " height="50px " weight="400px" ></div>

        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="aboutus.html">About</a></li>
            <li><a href="home.html#our-services">Service</a></li>
            <li><a href="contactus.html">Contact</a></li>
        </ul>

        <div class="auth-buttons">
            <button id="showLogin" class="sign-in-btn">Sign In</button>
            <button id="showSignup" class="sign-up-btn">Sign Up</button>
        </div>
    </nav>

    <!-- AUTH CONTAINER -->
    <div class="container">
        <div class="auth-box">
            <div class="form-container" id="formContainer">
                <!-- Login Form -->
                <div class="form-box login">
                    <i class="fas fa-heart icon-heart"></i>
                    <h2>Sign in to your account</h2>
                    <p>Enter your credentials to access your account</p>

                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" placeholder="Email" id="loginEmail" required>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Password" id="loginPassword" required>
                        <i class="fas fa-eye toggle-password"></i>
                    </div>

                    <button class="login-btn">Sign In</button>

                    <p>Don't have an account? <a href="#" id="toggleToSignUp">Sign up</a></p>
                </div>

                <!-- Sign Up Form -->
                <div class="form-box signup">
                    <i class="fas fa-heart icon-heart"></i>
                    <h2>Create an account</h2>
                    <p>Join us by creating an account</p>

                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="Full Name" id="fullName" required>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" placeholder="Email" id="signupEmail" required>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-phone"></i>
                        <input type="tel" placeholder="Phone Number" id="phoneNumber">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Password" id="signupPassword" required>
                        <i class="fas fa-eye toggle-password"></i>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Confirm Password" id="confirmPassword" required>
                        <i class="fas fa-eye toggle-password"></i>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the <a href="#">Terms and Conditions</a></label>
                    </div>

                    <button class="signup-btn">Sign Up</button>

                    <p>Already have an account? <a href="#" id="toggleToLogin">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/scriptinscrip.js"></script>
</body>
</html>
